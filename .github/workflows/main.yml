name: Compilar mod

# Este archivo trae TODO el código del mod adentro: arma las carpetas solo,
# compila con Gradle y deja el .jar para descargar en "Artifacts".
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Generar el proyecto
        run: |
          set -e
          mkdir -p mod-build
          cd mod-build
          mkdir -p src/main/java/dev/nico/tropiezo
          mkdir -p src/main/java/dev/nico/tropiezo/client
          mkdir -p src/main/java/dev/nico/tropiezo/mixin
          mkdir -p src/main/java/dev/nico/tropiezo/mixin/client
          mkdir -p src/main/resources
          cat > settings.gradle <<'TROPIEZO_EOF'
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          rootProject.name = 'tropiezo'
          TROPIEZO_EOF
          cat > gradle.properties <<'TROPIEZO_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric (1.21.1)
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.5
          fabric_version=0.102.0+1.21.1

          # Mod
          mod_version=1.0.0
          maven_group=dev.nico.tropiezo
          archives_base_name=tropiezo
          TROPIEZO_EOF
          cat > build.gradle <<'TROPIEZO_EOF'
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version

              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
              it.options.encoding = "UTF-8"
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          TROPIEZO_EOF
          cat > src/main/resources/fabric.mod.json <<'TROPIEZO_EOF'
          {
            "schemaVersion": 1,
            "id": "tropiezo",
            "version": "${version}",
            "name": "Tropiezo",
            "description": "Corré y tropezate: subir un píxel, flores, camas y caídas te tiran al piso.",
            "authors": ["Nico"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["dev.nico.tropiezo.TropiezoMod"],
              "client": ["dev.nico.tropiezo.client.TropiezoClient"]
            },
            "mixins": ["tropiezo.mixins.json"],
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          TROPIEZO_EOF
          cat > src/main/resources/tropiezo.mixins.json <<'TROPIEZO_EOF'
          {
            "required": true,
            "package": "dev.nico.tropiezo.mixin",
            "compatibilityLevel": "JAVA_21",
            "mixins": [
              "PlayerEntityMixin"
            ],
            "client": [
              "client.KeyboardInputMixin"
            ],
            "injectors": {
              "defaultRequire": 1
            }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/TripConfig.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import net.fabricmc.loader.api.FabricLoader;

          import java.io.IOException;
          import java.nio.file.Files;
          import java.nio.file.Path;

          /**
           * Configuración en config/tropiezo.json (se crea sola la primera vez).
           * Después de editarla, usá /tropiezo reload (permiso 2) o reiniciá el juego.
           */
          public final class TripConfig {
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();
              private static TripConfig instance = new TripConfig();

              // General
              public boolean enabled = true;
              public boolean requireSprint = true;      // solo tropieza corriendo (sprint)
              public boolean tripInCreative = true;
              public double minSpeed = 0.15;            // bloques por tick (correr ~0.28, caminar ~0.22)

              // Efecto de la caída
              public int tripDurationTicks = 40;        // 20 ticks = 1 segundo en el piso
              public int cooldownTicks = 40;            // espera después de levantarse
              public double pushStrength = 0.45;        // empujón hacia adelante
              public double hopStrength = 0.20;         // saltito al tropezar

              // Disparadores
              public boolean tripOnStepUp = true;       // subir un desnivel chico (tierra arada, camino, cama, alfombra...)
              public double stepUpChance = 1.0;
              public boolean tripOnStairsAndSlabs = false; // false = escaleras y losas NO te hacen tropezar
              public boolean tripOnFlowers = true;
              public double flowerChance = 0.4;
              public boolean tripOnFall = true;         // caerse de un bloque
              public double fallChance = 1.0;
              public double minFallHeight = 0.9;        // altura mínima de caída (bloques)

              public static TripConfig get() {
                  return instance;
              }

              public static void load() {
                  Path path = FabricLoader.getInstance().getConfigDir().resolve("tropiezo.json");
                  try {
                      if (Files.exists(path)) {
                          TripConfig loaded = GSON.fromJson(Files.readString(path), TripConfig.class);
                          if (loaded != null) {
                              instance = loaded;
                          }
                      }
                      // Reescribe el archivo para que siempre tenga todas las opciones nuevas
                      Files.writeString(path, GSON.toJson(instance));
                  } catch (Exception e) {
                      System.err.println("[tropiezo] No se pudo leer/escribir la config: " + e);
                  }
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/TripState.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo;

          import net.minecraft.entity.player.PlayerEntity;

          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;

          /**
           * Quién está tirado en el piso ahora mismo (por id de entidad).
           * SERVER lo llena el servidor; CLIENT lo llena el cliente al recibir el paquete.
           * Están separados para que en singleplayer (cliente + servidor en el mismo juego) no se pisen.
           */
          public final class TripState {
              public static final Set<Integer> SERVER = ConcurrentHashMap.newKeySet();
              public static final Map<Integer, Integer> CLIENT = new ConcurrentHashMap<>();

              private TripState() {
              }

              public static boolean isTripped(PlayerEntity player) {
                  if (player.getWorld().isClient()) {
                      return CLIENT.containsKey(player.getId());
                  }
                  return SERVER.contains(player.getId());
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/TripPayload.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo;

          import net.minecraft.network.RegistryByteBuf;
          import net.minecraft.network.codec.PacketCodec;
          import net.minecraft.network.codec.PacketCodecs;
          import net.minecraft.network.packet.CustomPayload;
          import net.minecraft.util.Identifier;

          /** Servidor -> cliente: "este jugador se cayó por N ticks" (ticks = 0 significa que se levantó). */
          public record TripPayload(int entityId, int ticks) implements CustomPayload {
              public static final CustomPayload.Id<TripPayload> ID =
                      new CustomPayload.Id<>(Identifier.of(TropiezoMod.MOD_ID, "trip"));

              public static final PacketCodec<RegistryByteBuf, TripPayload> CODEC = PacketCodec.tuple(
                      PacketCodecs.VAR_INT, TripPayload::entityId,
                      PacketCodecs.VAR_INT, TripPayload::ticks,
                      TripPayload::new
              );

              @Override
              public CustomPayload.Id<? extends CustomPayload> getId() {
                  return ID;
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/TripHandler.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo;

          import net.fabricmc.fabric.api.networking.v1.PlayerLookup;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;
          import net.minecraft.block.BlockState;
          import net.minecraft.network.packet.s2c.play.EntityVelocityUpdateS2CPacket;
          import net.minecraft.registry.tag.BlockTags;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;

          import java.util.HashMap;
          import java.util.Map;
          import java.util.UUID;

          /** Lógica del servidor: detecta cuándo te tropezás y te tira al piso. */
          public final class TripHandler {
              private static final Map<UUID, Data> DATA = new HashMap<>();

              private TripHandler() {
              }

              private static final class Data {
                  boolean init;
                  boolean lastOnGround;
                  double lastX, lastY, lastZ;
                  double airStartY;
                  int trippedTicks;
                  int cooldown;
                  BlockPos lastFlower;
              }

              public static void tick(MinecraftServer server) {
                  for (ServerPlayerEntity player : server.getPlayerManager().getPlayerList()) {
                      tickPlayer(player);
                  }
              }

              private static void tickPlayer(ServerPlayerEntity p) {
                  TripConfig cfg = TripConfig.get();
                  Data d = DATA.computeIfAbsent(p.getUuid(), k -> new Data());

                  double x = p.getX();
                  double y = p.getY();
                  double z = p.getZ();
                  boolean onGround = p.isOnGround();

                  if (!d.init) {
                      d.init = true;
                      d.airStartY = y;
                      save(d, x, y, z, onGround);
                      return;
                  }

                  double dx = x - d.lastX;
                  double dy = y - d.lastY;
                  double dz = z - d.lastZ;
                  double speed = Math.sqrt(dx * dx + dz * dz);

                  // Desde dónde empezó la caída
                  if (d.lastOnGround && !onGround) {
                      d.airStartY = d.lastY;
                  }

                  if (!p.isAlive()) {
                      endTrip(p, d);
                  } else if (d.trippedTicks > 0) {
                      d.trippedTicks--;
                      if (d.trippedTicks == 0) {
                          endTrip(p, d);
                      }
                  } else {
                      if (d.cooldown > 0) {
                          d.cooldown--;
                      }
                      if (cfg.enabled && d.cooldown == 0 && eligible(p, cfg) && shouldTrip(p, d, cfg, dy, speed, onGround)) {
                          startTrip(p, d, cfg, dx, dz);
                      }
                  }

                  save(d, x, y, z, onGround);
              }

              private static void save(Data d, double x, double y, double z, boolean onGround) {
                  d.lastX = x;
                  d.lastY = y;
                  d.lastZ = z;
                  d.lastOnGround = onGround;
              }

              private static boolean eligible(ServerPlayerEntity p, TripConfig cfg) {
                  if (p.isSpectator() || p.hasVehicle() || p.isTouchingWater() || p.isInLava()
                          || p.isClimbing() || p.isFallFlying() || p.isSleeping() || p.getAbilities().flying) {
                      return false;
                  }
                  if (!cfg.tripInCreative && p.isCreative()) {
                      return false;
                  }
                  return !cfg.requireSprint || p.isSprinting();
              }

              private static boolean shouldTrip(ServerPlayerEntity p, Data d, TripConfig cfg, double dy, double speed, boolean onGround) {
                  // Flores: tener el bloque de los pies dentro de una flor (no tienen colisión)
                  BlockPos feet = p.getBlockPos();
                  boolean inFlower = p.getWorld().getBlockState(feet).isIn(BlockTags.FLOWERS);
                  if (!inFlower) {
                      d.lastFlower = null;
                  }

                  if (speed < cfg.minSpeed) {
                      return false;
                  }

                  // 1) Subir un desnivel chico (1 píxel de tierra arada/camino, cama, alfombra...)
                  if (cfg.tripOnStepUp && d.lastOnGround && onGround && dy > 0.02 && dy < 0.65) {
                      if (cfg.tripOnStairsAndSlabs || !standingOnStairsOrSlab(p)) {
                          if (roll(p, cfg.stepUpChance)) {
                              return true;
                          }
                      }
                  }

                  // 2) Flores (una sola tirada por flor)
                  if (cfg.tripOnFlowers && inFlower && !feet.equals(d.lastFlower)) {
                      d.lastFlower = feet.toImmutable();
                      if (roll(p, cfg.flowerChance)) {
                          return true;
                      }
                  }

                  // 3) Caerse de un bloque: aterrizar corriendo después de bajar al menos minFallHeight
                  if (cfg.tripOnFall && !d.lastOnGround && onGround && (d.airStartY - p.getY()) >= cfg.minFallHeight) {
                      return roll(p, cfg.fallChance);
                  }

                  return false;
              }

              private static boolean standingOnStairsOrSlab(ServerPlayerEntity p) {
                  Box box = p.getBoundingBox();
                  int y = MathHelper.floor(box.minY - 0.01);
                  for (int bx = MathHelper.floor(box.minX); bx <= MathHelper.floor(box.maxX); bx++) {
                      for (int bz = MathHelper.floor(box.minZ); bz <= MathHelper.floor(box.maxZ); bz++) {
                          BlockState state = p.getWorld().getBlockState(new BlockPos(bx, y, bz));
                          if (state.isIn(BlockTags.STAIRS) || state.isIn(BlockTags.SLABS)) {
                              return true;
                          }
                      }
                  }
                  return false;
              }

              private static boolean roll(ServerPlayerEntity p, double chance) {
                  return chance >= 1.0 || p.getRandom().nextDouble() < chance;
              }

              /** Para el comando /tropiezo: tira al jugador sin importar las condiciones. */
              public static void forceTrip(ServerPlayerEntity p) {
                  Data d = DATA.computeIfAbsent(p.getUuid(), k -> new Data());
                  if (d.trippedTicks > 0) {
                      return;
                  }
                  startTrip(p, d, TripConfig.get(), 0, 0);
              }

              private static void startTrip(ServerPlayerEntity p, Data d, TripConfig cfg, double dx, double dz) {
                  d.trippedTicks = cfg.tripDurationTicks;
                  d.cooldown = cfg.cooldownTicks;
                  TripState.SERVER.add(p.getId());

                  Vec3d dir = new Vec3d(dx, 0, dz);
                  if (dir.lengthSquared() < 1.0E-6) {
                      dir = Vec3d.fromPolar(0, p.getYaw());
                  }
                  dir = dir.normalize();

                  p.setSprinting(false);
                  p.setVelocity(dir.x * cfg.pushStrength, cfg.hopStrength, dir.z * cfg.pushStrength);
                  p.networkHandler.sendPacket(new EntityVelocityUpdateS2CPacket(p));

                  p.getWorld().playSound(null, p.getX(), p.getY(), p.getZ(),
                          SoundEvents.ENTITY_PLAYER_BIG_FALL, SoundCategory.PLAYERS, 0.7F, 1.0F);

                  broadcast(p, cfg.tripDurationTicks);
              }

              private static void endTrip(ServerPlayerEntity p, Data d) {
                  boolean was = d.trippedTicks > 0 || TripState.SERVER.contains(p.getId());
                  d.trippedTicks = 0;
                  TripState.SERVER.remove(p.getId());
                  if (was) {
                      broadcast(p, 0);
                  }
              }

              private static void broadcast(ServerPlayerEntity p, int ticks) {
                  TripPayload payload = new TripPayload(p.getId(), ticks);
                  ServerPlayNetworking.send(p, payload);
                  for (ServerPlayerEntity other : PlayerLookup.tracking(p)) {
                      ServerPlayNetworking.send(other, payload);
                  }
              }

              /** Se llama cuando el jugador se desconecta. */
              public static void forget(ServerPlayerEntity p) {
                  DATA.remove(p.getUuid());
                  TripState.SERVER.remove(p.getId());
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/TropiezoMod.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents;
          import net.minecraft.server.command.CommandManager;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.text.Text;

          public class TropiezoMod implements ModInitializer {
              public static final String MOD_ID = "tropiezo";

              @Override
              public void onInitialize() {
                  TripConfig.load();

                  PayloadTypeRegistry.playS2C().register(TripPayload.ID, TripPayload.CODEC);

                  ServerTickEvents.END_SERVER_TICK.register(TripHandler::tick);
                  ServerPlayConnectionEvents.DISCONNECT.register((handler, server) -> TripHandler.forget(handler.getPlayer()));

                  // /tropiezo        -> te tropezás vos (sirve para probar)
                  // /tropiezo reload -> recarga config/tropiezo.json (requiere permiso 2)
                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) ->
                          dispatcher.register(CommandManager.literal("tropiezo")
                                  .executes(ctx -> {
                                      ServerPlayerEntity player = ctx.getSource().getPlayerOrThrow();
                                      TripHandler.forceTrip(player);
                                      return 1;
                                  })
                                  .then(CommandManager.literal("reload")
                                          .requires(source -> source.hasPermissionLevel(2))
                                          .executes(ctx -> {
                                              TripConfig.load();
                                              ctx.getSource().sendFeedback(() -> Text.literal("Config de Tropiezo recargada"), false);
                                              return 1;
                                          }))));
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/client/TropiezoClient.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo.client;

          import dev.nico.tropiezo.TripPayload;
          import dev.nico.tropiezo.TripState;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayConnectionEvents;
          import net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;

          import java.util.Iterator;
          import java.util.Map;

          public class TropiezoClient implements ClientModInitializer {
              @Override
              public void onInitializeClient() {
                  ClientPlayNetworking.registerGlobalReceiver(TripPayload.ID, (payload, context) -> {
                      if (payload.ticks() <= 0) {
                          TripState.CLIENT.remove(payload.entityId());
                      } else {
                          TripState.CLIENT.put(payload.entityId(), payload.ticks());
                      }
                  });

                  // Cuenta regresiva en el cliente (por si se pierde el paquete de "se levantó")
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      Iterator<Map.Entry<Integer, Integer>> it = TripState.CLIENT.entrySet().iterator();
                      while (it.hasNext()) {
                          Map.Entry<Integer, Integer> entry = it.next();
                          int left = entry.getValue() - 1;
                          if (left <= 0) {
                              it.remove();
                          } else {
                              entry.setValue(left);
                          }
                      }
                  });

                  ClientPlayConnectionEvents.DISCONNECT.register((handler, client) -> TripState.CLIENT.clear());
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/mixin/PlayerEntityMixin.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo.mixin;

          import dev.nico.tropiezo.TripState;
          import net.minecraft.entity.EntityPose;
          import net.minecraft.entity.player.PlayerEntity;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** Mientras estás "tropezado", el jugador queda en pose de gateo (acostado boca abajo). */
          @Mixin(PlayerEntity.class)
          public abstract class PlayerEntityMixin {
              @Inject(method = "updatePose", at = @At("HEAD"), cancellable = true)
              private void tropiezo$forceProne(CallbackInfo ci) {
                  PlayerEntity self = (PlayerEntity) (Object) this;
                  if (TripState.isTripped(self)) {
                      self.setPose(EntityPose.SWIMMING);
                      ci.cancel();
                  }
              }
          }
          TROPIEZO_EOF
          cat > src/main/java/dev/nico/tropiezo/mixin/client/KeyboardInputMixin.java <<'TROPIEZO_EOF'
          package dev.nico.tropiezo.mixin.client;

          import dev.nico.tropiezo.TripState;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.input.Input;
          import net.minecraft.client.input.KeyboardInput;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          /** Mientras estás en el piso no podés moverte ni saltar. */
          @Mixin(KeyboardInput.class)
          public class KeyboardInputMixin {
              @Inject(method = "tick", at = @At("TAIL"))
              private void tropiezo$lockInput(boolean slowDown, float f, CallbackInfo ci) {
                  MinecraftClient client = MinecraftClient.getInstance();
                  if (client.player != null && TripState.isTripped(client.player)) {
                      Input input = (Input) (Object) this;
                      input.pressingForward = false;
                      input.pressingBack = false;
                      input.pressingLeft = false;
                      input.pressingRight = false;
                      input.movementForward = 0.0F;
                      input.movementSideways = 0.0F;
                      input.jumping = false;
                      input.sneaking = false;
                  }
              }
          }
          TROPIEZO_EOF
          find . -type f | sort

      - name: Compilar
        working-directory: mod-build
        run: gradle build --no-daemon

      - name: Verificar que el .jar no esté vacío
        run: |
          JAR=$(ls mod-build/build/libs/tropiezo-*.jar | grep -v sources | head -n 1)
          SIZE=$(stat -c%s "$JAR")
          echo "Archivo: $JAR - $SIZE bytes"
          unzip -l "$JAR"
          if [ "$SIZE" -lt 5000 ]; then
            echo "ERROR: el .jar quedó vacío o incompleto"
            exit 1
          fi

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: tropiezo-jar
          path: |
            mod-build/build/libs/*.jar
            !mod-build/build/libs/*-sources.jar
